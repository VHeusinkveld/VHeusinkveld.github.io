name: Website checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    name: Build and check Jekyll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build the site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
      - name: Check pages and local links
        run: python3 tests/check_site.py _site
      - uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: _site
